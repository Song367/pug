name: Release

# Releases are deliberate, not every push. Pushing a SemVer tag (vX.Y.Z) builds the
# seventeen per-role images and pushes them to GHCR (GitHub Container Registry). Plain branch
# pushes never trigger this — they only run CI (ci.yaml).
on:
  push:
    tags:
      - "v*.*.*"

# One release per tag; don't run two builds for the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push images to GHCR via the built-in GITHUB_TOKEN
  id-token: write # keyless Cosign certificate and BuildKit provenance
  attestations: write

env:
  # Package-per-role on GHCR under the org: ghcr.io/pug-sh/pug-<name>.
  IMAGE_PREFIX: ghcr.io/song367/pug

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: server,                  cmd: server,                   target: app }
          - { name: ingress,                 cmd: ingress,                  target: app }
          - { name: insights-ingress,        cmd: insights-ingress,         target: app }
          - { name: compliance-ingress,      cmd: compliance-ingress,       target: app }
          - { name: session-gateway,         cmd: session-gateway,          target: app }
          - { name: bootstrap,               cmd: bootstrap,                target: app }
          - { name: worker-events,           cmd: workers/events,           target: worker }
          - { name: worker-email,            cmd: workers/email,            target: worker }
          - { name: worker-profile-identify, cmd: workers/profile/identify, target: worker }
          - { name: worker-profile-alias,    cmd: workers/profile/alias,    target: worker }
          - { name: worker-profile-upsert,   cmd: workers/profile/upsert,   target: worker }
          - { name: worker-compliance,       cmd: workers/compliance,       target: worker }
          - { name: worker-demo,             cmd: workers/demo,             target: worker }
          - { name: cron-usage,              cmd: cron/usage,               target: app }
          - { name: migrate-postgres,        cmd: migrate/postgres,         target: migrate }
          - { name: migrate-clickhouse,      cmd: migrate/clickhouse,       target: migrate }
          - { name: migrate-nats,            cmd: migrate/nats,             target: migrate }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          # vX.Y.Z -> :X.Y.Z and :X.Y ; :latest is added automatically for
          # non-prerelease semver tags (flavor latest=auto).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          # Keep the action's immutable Git context so BuildKit provenance
          # contains the signed repository and commit material.
          target: ${{ matrix.target }}
          build-args: |
            CMD=${{ matrix.cmd }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          # Per-name cache scope so the seventeen parallel builds don't clobber each other.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Sign immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify signature, provenance revision, and SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yaml@${{ github.ref }}
        run: |
          cosign verify \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
          provenance="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Provenance}}')"
          jq -e --arg revision "${GITHUB_SHA}" --arg source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" '
            def normalize_source:
              ascii_downcase
              | sub("^git\\+"; "")
              | split("#")[0]
              | split("?")[0]
              | sub("\\.git$"; "");
            def has_source_uri:
              (.uri? | type == "string") and (.uri | length) > 0;
            def has_revision_digest:
              (.digest? | type == "object") and
              ([.digest.sha1?, .digest.gitCommit?]
                | map(select(type == "string" and length > 0))
                | length) > 0;
            def authoritative_sources:
              [
                .invocation.configSource?,
                .predicate.invocation.configSource?
              ] | map(select(type == "object" and has_source_uri));
            def fallback_sources:
              [
                .materials[]?,
                .buildDefinition.resolvedDependencies[]?,
                .predicate.materials[]?,
                .predicate.buildDefinition.resolvedDependencies[]?
              ] | map(select(type == "object" and has_source_uri and has_revision_digest));
            def source_candidates:
              authoritative_sources as $authoritative
              | if ($authoritative | length) > 0 then $authoritative else fallback_sources end;
            def binds_source($expected_source; $expected_revision):
              source_candidates as $sources
              | ($sources | length) > 0 and
                all($sources[];
                  ((.uri? // "") | type == "string") and
                  ((.uri | normalize_source) == ($expected_source | normalize_source)) and
                  ((.digest? // {}) | type == "object") and
                  ([.digest.sha1?, .digest.gitCommit?]
                    | map(select(type == "string"))
                    | index($expected_revision) != null));
            [.. | objects | .SLSA? | select(type == "object")] as $slsa |
            ($slsa | length) > 0 and
            all($slsa[]; binds_source($source; $revision))
          ' <<<"${provenance}" >/dev/null
          sbom="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .SBOM}}')"
          jq -e '[.. | objects | .SPDXID? // empty] | index("SPDXRef-DOCUMENT") != null' \
            <<<"${sbom}" >/dev/null
